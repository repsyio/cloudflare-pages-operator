version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      time: '00:30'
      timezone: 'Europe/Amsterdam'
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      maven-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: '00:30'
      timezone: 'Europe/Amsterdam'
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: '00:30'
      timezone: 'Europe/Amsterdam'
    groups:
      operator-images:
        patterns:
          - "*"
    ignore:
      # Stay on the Java 25 / Node 24 runtimes; RPS-2408.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"

  - package-ecosystem: docker
    directory: /deployer
    schedule:
      interval: weekly
      time: '00:30'
      timezone: 'Europe/Amsterdam'
    groups:
      deployer-images:
        patterns:
          - "*"
    ignore:
      # Stay on the Java 25 / Node 24 runtimes; RPS-2408.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
