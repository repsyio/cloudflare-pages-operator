{{- if not .Values.cloudflare.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cfpo.fullname" . }}
  labels:
    {{- include "cfpo.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-token: {{ required "cloudflare.apiToken is required (or set cloudflare.existingSecret)" .Values.cloudflare.apiToken | quote }}
{{- end }}
